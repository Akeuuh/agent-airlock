# Proxy egress — socle COMMUN (sans domaines). Le launcher génère le squid.conf
# runtime en injectant l'allowlist du profil courant à la place du marqueur
# @@ALLOWLIST@@ (voir bin/agent-sandbox.sh → egress_render_conf).
#
# Le conteneur harness n'a PAS de route internet directe ; sa seule sortie
# passe par ce proxy en allowlist stricte. Chaque harness a SA propre allowlist
# (profiles/<name>/allowlist.conf) → le sidecar egress est recréé au changement
# de harness (label agent-airlock.profile=<name>).

http_port 3128

# ─── Ports autorisés ──────────────────────────────────────────────────────────
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports

# ─── Domaines autorisés (injectés depuis profiles/<name>/allowlist.conf) ──────
# Garantit que l'acl existe même si le profil n'ajoute aucun domaine : squid
# REFUSE de démarrer si `allowed_domains` n'est jamais définie. Ce domaine bidon
# ne matche aucun trafic réel → allowlist vide = tout refusé (fail-closed propre).
acl allowed_domains dstdomain airlock.invalid.disabled
# @@ALLOWLIST@@

http_access allow allowed_domains
http_access deny all

# Pas de cache
cache deny all
