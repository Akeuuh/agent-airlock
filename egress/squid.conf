# Proxy egress — allowlist de sortie du conteneur Claude (conteneur C).
# Claude n'a PAS de route internet directe ; sa seule sortie passe par ici.

http_port 3128

# ─── Ports autorisés ──────────────────────────────────────────────────────────
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports

# ─── Domaines autorisés (allowlist) ───────────────────────────────────────────
acl allowed_domains dstdomain .anthropic.com
# TODO: ajouter ce dont mise/npm ont besoin AU BUILD ou au runtime, ex :
# acl allowed_domains dstdomain .npmjs.org registry.npmjs.org
# acl allowed_domains dstdomain mise.jdx.dev github.com objects.githubusercontent.com

http_access allow allowed_domains
http_access deny all

# Pas de cache
cache deny all
