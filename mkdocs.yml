site_name: agent-airlock
site_description: Run Claude Code in a Podman sandbox — docs & guides
repo_url: https://github.com/Akeuuh/agent-airlock
repo_name: Akeuuh/agent-airlock
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: docs/index.md
  - Quick Start: docs/get-started.md
  - How-To Guides:
      - Add MCP Server: docs/add-mcp.md
      - Add Skill: docs/add-skill.md
      - Add Command: docs/add-command.md
      - Egress Allowlist: docs/egress-allowlist.md
      - Build & Images: docs/build-and-images.md
      - Onboard a Teammate: docs/onboarding.md
  - Reference:
      - Architecture: docs/architecture.md
      - Profiles: docs/profiles.md
      - Network & MCP Tunnel: docs/network.md
      - Web Access: docs/web-access.md
      - Authentication: docs/authentication.md
  - Help:
      - Troubleshooting: docs/troubleshooting.md
  - Contribute: CONTRIBUTING.md
