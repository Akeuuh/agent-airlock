# Allowlist egress — profil opencode (opencode-ai).
# Fragment squid injecté dans egress/squid.base.conf par le launcher.
# Une entrée = un acl `allowed_domains dstdomain …` (voir docs/allowlist-egress.md).
#
# ⚠️ Les domaines des PROVIDERS (anthropic, openai…) viennent du catalogue
# providers/ (HARNESS_PROVIDERS / --provider), PAS d'ici. Ce fichier ne garde que
# l'INFRA propre au harness.
#
# opencode récupère la liste des providers/modèles depuis models.dev au démarrage.
acl allowed_domains dstdomain models.dev                    # catalogue providers/modèles (requis au boot)
# acl allowed_domains dstdomain .opencode.ai                # OpenCode Zen / auth (si utilisé)
# TODO: si install de plugins/MCP distants au runtime, ouvrir aussi :
# acl allowed_domains dstdomain .npmjs.org registry.npmjs.org
# acl allowed_domains dstdomain github.com raw.githubusercontent.com objects.githubusercontent.com
