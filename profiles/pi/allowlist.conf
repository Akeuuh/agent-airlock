# Allowlist egress — profil pi (@earendil-works/pi-coding-agent).
# Fragment squid injecté dans egress/squid.base.conf par le launcher.
# Une entrée = un acl `allowed_domains dstdomain …` (voir docs/allowlist-egress.md).
#
# ⚠️ Les domaines des PROVIDERS (anthropic, openai, deepseek…) ne sont PAS ici :
# ils viennent du catalogue providers/ selon HARNESS_PROVIDERS / --provider.
# Ce fichier ne garde QUE les domaines d'INFRA propres au harness.
#
# pi n'appelle par défaut que le provider. Décommente si tu installes au runtime :
# acl allowed_domains dstdomain .npmjs.org registry.npmjs.org   # pi update / extensions
# acl allowed_domains dstdomain github.com raw.githubusercontent.com objects.githubusercontent.com
