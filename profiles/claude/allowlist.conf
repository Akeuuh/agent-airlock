# Allowlist egress — profil claude (Claude Code, Anthropic).
# Fragment squid injecté dans egress/squid.base.conf par le launcher.
# Une entrée = un acl `allowed_domains dstdomain …` (voir docs/allowlist-egress.md).
#
#   .exemple.com  → le domaine ET ses sous-domaines
#   exemple.com   → l'hôte exact uniquement
#
# Claude Code v2 — voir code.claude.com/docs/en/network-config
acl allowed_domains dstdomain .anthropic.com          # api + statsig (télémétrie)
acl allowed_domains dstdomain .claude.ai              # login claude.ai + downloads.claude.ai
acl allowed_domains dstdomain .claude.com             # platform.claude.com (auth Console) + tenant
acl allowed_domains dstdomain raw.githubusercontent.com  # release notes / marketplace de skills
# TODO: ajouter ce dont mise/npm ont besoin si install au runtime, ex :
# acl allowed_domains dstdomain .npmjs.org registry.npmjs.org
# acl allowed_domains dstdomain mise.jdx.dev github.com objects.githubusercontent.com
